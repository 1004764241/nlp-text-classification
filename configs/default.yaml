project:
  name: "online-shopping-10cats-sentiment"
  seed: 42

data:
  raw_file: "data/online_shopping_10_cats.csv"
  processed_dir: "data/processed"
  train_file: "train.csv"
  val_file: "val.csv"
  test_file: "test.csv"
  text_column: "review"
  label_column: "cat"
  stopwords_file: "data/external/stopwords_hit.txt"

preprocess:
  use_jieba: true
  min_text_length: 5
  val_ratio: 0.1
  test_ratio: 0.1

train:
  model_type: "tfidf_svm"   # 可选: tfidf_nb | tfidf_svm | tfidf_lr
  max_features: 50000
  ngram_range: [1, 2]

  # TF-IDF 通用参数
  tfidf:
    sublinear_tf: true
    min_df: 2
    max_df: 0.95

  # SVM 参数（model_type: tfidf_svm 时生效）
  svm:
    C: 1.0
    kernel: "linear"
    max_iter: 1000

  # Naive Bayes 参数（model_type: tfidf_nb 时生效）
  nb:
    alpha: 0.1

  # Logistic Regression 参数（model_type: tfidf_lr 时生效）
  lr:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    multi_class: "multinomial"

output:
  model_dir: "models"
  results_dir: "results"
  exp_name: "exp001_tfidf_svm_baseline"
